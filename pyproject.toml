[project]
name = "receipt-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheOnyx-ox", email = "mljeko44@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "openai>=3.31.0",
    "openapi>=2.0.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
receipt-extractor = "receipt_extractor:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src/receipt_extractor"]
testpaths = ["tests"]
